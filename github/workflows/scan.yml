name: scan
on:
  schedule:
    - cron: "*/30 4-10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python nvx_scanner.py --out index.html
      - run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html nifty500list.csv
          git commit -m "update" || exit 0
          git push
